[package]
name = "velum-code"
version = "0.7.11"
description = "Velum Code — a desktop home for Muse, Codex and Antigravity"
authors = ["velumix"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "velum_code_lib"
# Windows links this library into the executable. The Android companion is a
# separate native app; it does not consume Tauri's mobile library outputs.
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.8"
uuid = { version = "1", features = ["v4", "v7"] }
axum = "0.8"
tokio = { version = "1", features = ["net", "sync", "time", "process", "io-util", "macros"] }
async-stream = "0.3"
sha2 = "0.10"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
vt100 = "0.16"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
croner = "3.0.1"
chrono = "0.4"
chrono-tz = "0.10"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

[target.'cfg(windows)'.dependencies]
tauri-plugin-updater = { version = "~2.12.0", default-features = false, features = ["rustls-tls", "system-proxy"] }
windows = { version = "0.61", features = ["Data_Xml_Dom", "UI_Notifications", "Win32_Security", "Win32_System_Com", "Win32_System_Diagnostics_ToolHelp", "Win32_System_JobObjects", "Win32_System_Pipes", "Win32_System_Threading", "Win32_UI_Notifications", "Win32_UI_Shell"] }
windows-core = "0.61"

[target.'cfg(unix)'.dependencies]
libc = "0.2"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
